<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sally | Staff login</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #233149; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    main { background: white; border: 1px solid #dfe5ee; border-radius: .7rem; max-width: 390px; padding: 2rem; width: 100%; }
    h1 { color: #3156a4; font-size: 1.4rem; margin-top: 0; }
    p { line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input { border: 1px solid #c8d0dd; border-radius: .4rem; font: inherit; padding: .7rem; width: 100%; }
    button { background: #3156a4; border: 0; border-radius: .4rem; color: white; cursor: pointer; font: inherit; margin-top: 1.2rem; padding: .75rem; width: 100%; }
    .error { background: #fff1f0; border: 1px solid #e8aaa5; border-radius: .4rem; padding: .75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sally staff dashboard</h1>
    <p>Sign in with the shared staff account.</p>
    <p class="error" role="alert" {{ERROR_HIDDEN}}>{{ERROR}}</p>
    <form method="post" action="/dashboard/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
